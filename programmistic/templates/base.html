<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Course App</title>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'dashboard' %}">Головна</a> |
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Мій профіль</a> |
                <form action="{% url 'login' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Вийти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Увійти</a> |
                <a href="{% url 'register' %}">Реєстрація</a>
            {% endif %}
        </nav>
    </header>
    <hr>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
